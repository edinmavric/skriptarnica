services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skripta
      POSTGRES_PASSWORD: skripta
      POSTGRES_DB: skripta
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skripta -d skripta']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
